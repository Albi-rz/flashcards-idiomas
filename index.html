<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idiomas Flashcards</title>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --text: #1e1b16;
    --text-muted: #6b655c;
    --accent: #b5541e;
    --accent-soft: #f0dcc9;
    --border: #e7e0d6;
    --good: #3f7d4f;
    --hard: #b5871e;
    --again: #b5341e;
    --easy: #2f6fb5;
    --shadow: 0 8px 24px rgba(30,27,22,0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --surface: #221e17;
      --text: #f2ede4;
      --text-muted: #a89f92;
      --accent: #e08a4d;
      --accent-soft: #3a2a1a;
      --border: #342e24;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --surface: #221e17;
    --text: #f2ede4;
    --text-muted: #a89f92;
    --accent: #e08a4d;
    --accent-soft: #3a2a1a;
    --border: #342e24;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 1.3rem; margin: 4px 0 2px; text-align: center; }
  .sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }

  .lang-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .lang-btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  select {
    flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.85rem;
  }
  .stats { display: flex; gap: 8px; margin-bottom: 14px; font-size: 0.78rem; color: var(--text-muted); }
  .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }

  .card-area { perspective: 1000px; height: 260px; margin-bottom: 18px; }
  .card {
    width: 100%; height: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow); display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 24px; cursor: pointer; position: relative;
  }
  .tag-chip {
    position: absolute; top: 12px; left: 12px; font-size: 0.68rem; color: var(--accent);
    background: var(--accent-soft); padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .card-text { font-size: 1.4rem; font-weight: 600; line-height: 1.4; }
  .card-hint { position: absolute; bottom: 14px; font-size: 0.75rem; color: var(--text-muted); }
  .back-text { color: var(--accent); }
  .speak-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .speak-btn:active { transform: scale(0.94); }
  .speak-btn[disabled] { opacity: 0.3; cursor: default; }

  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  button.rate { padding: 12px 4px; border-radius: 12px; border: none; font-size: 0.8rem; font-weight: 600; color: white; cursor: pointer; }
  .rate.again { background: var(--again); }
  .rate.hard { background: var(--hard); }
  .rate.good { background: var(--good); }
  .rate.easy { background: var(--easy); }
  button.rate:disabled { opacity: 0.35; }

  .done { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .reset { text-align: center; margin-top: 18px; }
  .reset button { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; text-decoration: underline; cursor: pointer; }
  footer { text-align: center; margin-top: 20px; font-size: 0.7rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Idiomas — Repaso</h1>
  <div class="sub">Repetición espaciada · toca la tarjeta para voltear</div>

  <div class="lang-toggle">
    <button class="lang-btn" data-lang="en">🇬🇧 Inglés</button>
    <button class="lang-btn" data-lang="pt">🇧🇷 Portugués</button>
  </div>

  <div class="bar">
    <select id="tagFilter"></select>
  </div>

  <div class="stats">
    <span class="stat-pill" id="dueCount">0 pendientes</span>
    <span class="stat-pill" id="totalCount">0 en total</span>
  </div>

  <div class="card-area">
    <div class="card" id="card">
      <span class="tag-chip" id="tagChip"></span>
      <button class="speak-btn" id="speakBtn" title="Escuchar pronunciación">🔊</button>
      <div class="card-text" id="cardText">Cargando…</div>
      <div class="card-hint" id="cardHint">Toca para ver la traducción</div>
    </div>
  </div>

  <div class="buttons">
    <button class="rate again" data-q="0">Again</button>
    <button class="rate hard" data-q="1">Hard</button>
    <button class="rate good" data-q="2">Good</button>
    <button class="rate easy" data-q="3">Easy</button>
  </div>

  <div class="reset">
    <button id="resetBtn">Reiniciar progreso de este idioma</button>
  </div>

  <footer>flashcards-idiomas · se actualiza con nuevas palabras cada cierto tiempo</footer>
</div>

const LANG_META = {
  en: { name: "Inglés", title: "🇬🇧 Inglés — Repaso" },
  pt: { name: "Portugués", title: "🇧🇷 Portugués — Repaso" }
};

const STORAGE_PREFIX = "idiomas_flashcards_progress_";
let currentLang = localStorage.getItem("idiomas_flashcards_lang") || "en";
let progress = {};
let currentIndex = -1;
let showingBack = false;
let filteredIds = [];

function storageKey() { return STORAGE_PREFIX + currentLang; }

function loadProgress() {
  try {
    const raw = localStorage.getItem(storageKey());
    progress = raw ? JSON.parse(raw) : {};
  } catch (e) { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem(storageKey(), JSON.stringify(progress)); } catch (e) {}
}
function getCard(i) {
  const key = String(i);
  if (!progress[key]) progress[key] = { ef: 2.5, interval: 0, reps: 0, due: 0 };
  return progress[key];
}

function setLang(lang) {
  currentLang = lang;
  try { localStorage.setItem("idiomas_flashcards_lang", lang); } catch (e) {}
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  document.getElementById("title").textContent = LANG_META[lang].title;
  loadProgress();
  populateTagFilter();
  buildQueue();
  showNext();
}

function populateTagFilter() {
  const deck = DECKS[currentLang];
  const tags = Array.from(new Set(deck.map(c => c[2])));
  const select = document.getElementById("tagFilter");
  select.innerHTML = '<option value="all">Todos los temas</option>' +
    tags.map(t => `<option value="${t}">${t}</option>`).join("");
}

function buildQueue() {
  const deck = DECKS[currentLang];
  const tagVal = document.getElementById("tagFilter").value;
  const now = Date.now();
  filteredIds = deck
    .map((c, i) => i)
    .filter(i => tagVal === "all" || deck[i][2] === tagVal)
    .filter(i => getCard(i).due <= now);
  for (let i = filteredIds.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredIds[i], filteredIds[j]] = [filteredIds[j], filteredIds[i]];
  }
  updateStats(tagVal);
}

function updateStats(tagVal) {
  const deck = DECKS[currentLang];
  const totalForTag = deck.filter(c => tagVal === "all" || c[2] === tagVal).length;
  document.getElementById("dueCount").textContent = filteredIds.length + " pendientes";
  document.getElementById("totalCount").textContent = totalForTag + " en total";
}

function showNext() {
  showingBack = false;
  if (filteredIds.length === 0) {
    document.getElementById("card").innerHTML =
      '<div class="done">🎉 Por ahora no hay tarjetas pendientes en este tema.<br>Vuelve más tarde o cambia de tema/idioma arriba.</div>';
    setButtonsEnabled(false);
    currentIndex = -1;
    return;
  }
  setButtonsEnabled(true);
  currentIndex = filteredIds[0];
  renderCard();
}

const SPEECH_LANG = { en: "en-US", pt: "pt-BR" };
let voicesCache = null;

function loadVoices() {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) { resolve([]); return; }
    let voices = window.speechSynthesis.getVoices();
    if (voices.length) { resolve(voices); return; }
    window.speechSynthesis.onvoiceschanged = () => resolve(window.speechSynthesis.getVoices());
    setTimeout(() => resolve(window.speechSynthesis.getVoices()), 1000);
  });
}

function pickVoice(voices, langTag) {
  const base = langTag.split("-")[0].toLowerCase();
  return voices.find(v => v.lang.toLowerCase() === langTag.toLowerCase())
      || voices.find(v => v.lang.toLowerCase().startsWith(base))
      || null;
}

function cleanForSpeech(text) {
  return text.replace(/\([^)]*\)/g, "").trim();
}

async function refreshSpeakAvailability() {
  const btn = document.getElementById("speakBtn");
  if (!btn || !("speechSynthesis" in window)) { if (btn) btn.disabled = true; return; }
  voicesCache = voicesCache || await loadVoices();
  const voice = pickVoice(voicesCache, SPEECH_LANG[currentLang]);
  if (!voice) {
    btn.textContent = "🔇";
    btn.title = "Falta instalar la voz de este idioma en tu dispositivo (Ajustes > Accesibilidad > Contenido hablado > Voces)";
  } else {
    btn.textContent = "🔊";
    btn.title = "Escuchar pronunciación";
  }
}

async function speakCurrentFront() {
  const deck = DECKS[currentLang];
  if (currentIndex === -1 || !deck[currentIndex]) return;
  if (!("speechSynthesis" in window)) return;
  try {
    voicesCache = voicesCache || await loadVoices();
    const voice = pickVoice(voicesCache, SPEECH_LANG[currentLang]);
    if (!voice) {
      alert("Tu dispositivo no tiene instalada la voz de " + LANG_META[currentLang].name + ". Ve a Ajustes > Accesibilidad > Contenido hablado > Voces y descárgala para poder escuchar la pronunciación correcta.");
      return;
    }
    window.speechSynthesis.cancel();
    const text = cleanForSpeech(deck[currentIndex][0]);
    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = voice;
    utter.lang = voice.lang;
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function renderCard() {
  const deck = DECKS[currentLang];
  const [front, back, tag] = deck[currentIndex];
  const card = document.getElementById("card");
  card.innerHTML = `
    <span class="tag-chip">${tag}</span>
    <button class="speak-btn" id="speakBtn" title="Escuchar pronunciación">🔊</button>
    <div class="card-text" id="cardText">${showingBack ? back : front}</div>
    <div class="card-hint">${showingBack ? "" : "Toca para ver la traducción"}</div>
  `;
  if (showingBack) card.querySelector(".card-text").classList.add("back-text");
  refreshSpeakAvailability();
}

function setButtonsEnabled(enabled) {
  document.querySelectorAll("button.rate").forEach(b => b.disabled = !enabled);
}

document.getElementById("card").addEventListener("click", (e) => {
  if (currentIndex === -1) return;
  if (e.target && e.target.id === "speakBtn") {
    e.stopPropagation();
    speakCurrentFront();
    return;
  }
  showingBack = !showingBack;
  renderCard();
});

document.querySelectorAll("button.rate").forEach(btn => {
  btn.addEventListener("click", () => {
    if (currentIndex === -1) return;
    const q = parseInt(btn.dataset.q, 10);
    rate(currentIndex, q);
    filteredIds.shift();
    document.getElementById("dueCount").textContent = filteredIds.length + " pendientes";
    showNext();
  });
});

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

document.getElementById("tagFilter").addEventListener("change", () => { buildQueue(); showNext(); });

function rate(i, q) {
  const c = getCard(i);
  const now = Date.now();
  const DAY = 24 * 60 * 60 * 1000;
  if (q === 0) {
    c.reps = 0; c.interval = 0;
    c.due = now + 5 * 60 * 1000;
    c.ef = Math.max(1.3, c.ef - 0.2);
  } else {
    c.reps += 1;
    if (q === 1) c.ef = Math.max(1.3, c.ef - 0.15);
    if (q === 3) c.ef = c.ef + 0.15;
    if (c.reps === 1) c.interval = q === 1 ? 1 : (q === 3 ? 3 : 1);
    else if (c.reps === 2) c.interval = q === 1 ? 2 : (q === 3 ? 8 : 4);
    else c.interval = Math.round(c.interval * c.ef);
    c.due = now + c.interval * DAY;
  }
  progress[String(i)] = c;
  saveProgress();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("¿Reiniciar el progreso de " + LANG_META[currentLang].name + " en este dispositivo?")) {
    progress = {};
    saveProgress();
    buildQueue();
    showNext();
  }
});

setLang(currentLang);
</script>
</body>

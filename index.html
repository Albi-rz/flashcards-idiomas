<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idiomas — Cuaderno de viaje</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B3%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --bg: #eef0e8;
    --surface: #f8f7f1;
    --ink: #262a24;
    --ink-muted: #6e7266;
    --accent: #b4802f;
    --accent-soft: #e7dcc4;
    --line: #d8d5c6;
    --again: #a1402f;
    --hard: #b4802f;
    --good: #3f6b4a;
    --easy: #2f5d70;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --surface: #1c1f26;
      --ink: #e9e6dd;
      --ink-muted: #8b8f86;
      --accent: #d1a24a;
      --accent-soft: #2c2a1f;
      --line: #2d2f2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b; --surface: #1c1f26; --ink: #e9e6dd; --ink-muted: #8b8f86;
    --accent: #d1a24a; --accent-soft: #2c2a1f; --line: #2d2f2a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 18px 36px;
  }
  .wrap { width: 100%; max-width: 460px; }

  header { margin-bottom: 18px; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.65rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 0.85rem;
    color: var(--ink-muted);
    font-style: italic;
    font-family: var(--serif);
  }

  nav.tabs {
    display: flex;
    gap: 22px;
    margin: 18px 0 14px;
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button {
    background: none; border: none; cursor: pointer;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--ink-muted);
    padding: 0 0 10px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }

  .field {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
  }
  .field label { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-muted); white-space: nowrap; }
  select {
    flex: 1; border: none; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--ink); font-size: 0.88rem; padding: 4px 2px; font-family: inherit;
  }
  select:focus { outline: none; border-bottom-color: var(--accent); }

  .ledger {
    display: flex; justify-content: space-between; font-family: var(--mono);
    font-size: 0.72rem; color: var(--ink-muted); margin-bottom: 18px;
  }

  .scene { perspective: 1400px; height: 250px; margin-bottom: 20px; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.2,.8,.3,1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px 22px; cursor: pointer;
  }
  .face.back { transform: rotateY(180deg); }

  .stamp {
    position: absolute; top: 14px; left: 16px;
    font-family: var(--mono); font-size: 0.68rem; color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 50%;
    width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
    transform: rotate(-8deg); line-height: 1.1; padding: 4px;
  }
  .speak-btn {
    position: absolute; top: 12px; right: 12px; width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--accent-soft);
    color: var(--accent); font-size: 1.05rem; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .speak-btn:active { transform: scale(0.94); }

  .word {
    font-family: var(--serif); font-weight: 600; font-size: 1.55rem; line-height: 1.35;
    max-width: 90%;
  }
  .word.back { color: var(--accent); font-weight: 400; }
  .hint { position: absolute; bottom: 14px; font-size: 0.72rem; color: var(--ink-muted); }

  .done { text-align: center; padding: 20px; color: var(--ink-muted); font-family: var(--serif); font-size: 1.05rem; }

  .rating { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .rating button {
    flex: 1; padding: 13px 4px; border: none; background: var(--surface); cursor: pointer;
    font-family: var(--mono); font-size: 0.76rem; color: var(--ink-muted);
    border-bottom: 3px solid transparent; border-right: 1px solid var(--line);
  }
  .rating button:last-child { border-right: none; }
  .rating button:disabled { opacity: 0.35; }
  .rating button[data-q="0"] { border-bottom-color: var(--again); }
  .rating button[data-q="1"] { border-bottom-color: var(--hard); }
  .rating button[data-q="2"] { border-bottom-color: var(--good); }
  .rating button[data-q="3"] { border-bottom-color: var(--easy); }
  .rating button:not(:disabled):active { color: var(--ink); }

  .foot { display: flex; justify-content: space-between; align-items: baseline; }
  .reset { background: none; border: none; color: var(--ink-muted); font-size: 0.72rem;
    text-decoration: underline; cursor: pointer; font-family: inherit; padding: 0; }
  .colophon { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Cuaderno de viaje</h1>
    <div class="sub">repite hasta que se sienta tuyo</div>
  </header>

  <nav class="tabs">
    <button data-lang="en">Inglés</button>
    <button data-lang="pt">Português</button>
  </nav>

  <div class="field">
    <label for="tagFilter">tema</label>
    <select id="tagFilter"></select>
  </div>

  <div class="ledger">
    <span id="dueCount">0 pendientes</span>
    <span id="totalCount">0 en total</span>
  </div>

  <div class="scene">
    <div class="card-inner" id="cardInner">
      <div class="face front" id="faceFront">
        <span class="stamp" id="stampFront"></span>
        <button class="speak-btn" id="speakBtnFront" title="Escuchar pronunciación">🔊</button>
        <div class="word" id="wordFront">Cargando…</div>
        <div class="hint">toca para traducir</div>
      </div>
      <div class="face back" id="faceBack">
        <span class="stamp" id="stampBack"></span>
        <button class="speak-btn" id="speakBtnBack" title="Escuchar pronunciación">🔊</button>
        <div class="word back" id="wordBack"></div>
      </div>
    </div>
  </div>
  <div class="done" id="doneMsg" style="display:none"></div>

  <div class="rating">
    <button class="rate" data-q="0">again</button>
    <button class="rate" data-q="1">hard</button>
    <button class="rate" data-q="2">good</button>
    <button class="rate" data-q="3">easy</button>
  </div>

  <div class="foot">
    <button class="reset" id="resetBtn">reiniciar progreso de este idioma</button>
    <span class="colophon">flashcards-idiomas</span>
  </div>
</div>

const LANG_META = {
  en: { name: "Inglés", title: "Cuaderno de viaje — English" },
  pt: { name: "Português", title: "Cuaderno de viaje — Português" }
};
const SPEECH_LANG = { en: "en-US", pt: "pt-BR" };

const STORAGE_PREFIX = "idiomas_flashcards_progress_";
let currentLang = localStorage.getItem("idiomas_flashcards_lang") || "en";
let progress = {};
let currentIndex = -1;
let showingBack = false;
let filteredIds = [];
let voicesCache = null;

function storageKey() { return STORAGE_PREFIX + currentLang; }
function loadProgress() {
  try { const raw = localStorage.getItem(storageKey()); progress = raw ? JSON.parse(raw) : {}; }
  catch (e) { progress = {}; }
}
function saveProgress() { try { localStorage.setItem(storageKey(), JSON.stringify(progress)); } catch (e) {} }
function getCard(i) {
  const key = String(i);
  if (!progress[key]) progress[key] = { ef: 2.5, interval: 0, reps: 0, due: 0 };
  return progress[key];
}

function setLang(lang) {
  currentLang = lang;
  try { localStorage.setItem("idiomas_flashcards_lang", lang); } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  document.getElementById("title").textContent = LANG_META[lang].title;
  loadProgress();
  populateTagFilter();
  buildQueue();
  showNext();
}

function populateTagFilter() {
  const deck = DECKS[currentLang];
  const tags = Array.from(new Set(deck.map(c => c[2])));
  const select = document.getElementById("tagFilter");
  select.innerHTML = '<option value="all">todos</option>' + tags.map(t => `<option value="${t}">${t}</option>`).join("");
}

function buildQueue() {
  const deck = DECKS[currentLang];
  const tagVal = document.getElementById("tagFilter").value;
  const now = Date.now();
  filteredIds = deck.map((c, i) => i)
    .filter(i => tagVal === "all" || deck[i][2] === tagVal)
    .filter(i => getCard(i).due <= now);
  for (let i = filteredIds.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredIds[i], filteredIds[j]] = [filteredIds[j], filteredIds[i]];
  }
  updateStats(tagVal);
}

function updateStats(tagVal) {
  const deck = DECKS[currentLang];
  const totalForTag = deck.filter(c => tagVal === "all" || c[2] === tagVal).length;
  document.getElementById("dueCount").textContent = filteredIds.length + " pendientes";
  document.getElementById("totalCount").textContent = totalForTag + " en total";
}

function showNext() {
  showingBack = false;
  document.getElementById("cardInner").classList.remove("flipped");
  if (filteredIds.length === 0) {
    document.querySelector(".scene").style.display = "none";
    const msg = document.getElementById("doneMsg");
    msg.style.display = "block";
    msg.textContent = "Por ahora no hay tarjetas pendientes en este tema. Vuelve más tarde o cambia de tema.";
    setButtonsEnabled(false);
    currentIndex = -1;
    return;
  }
  document.querySelector(".scene").style.display = "block";
  document.getElementById("doneMsg").style.display = "none";
  setButtonsEnabled(true);
  currentIndex = filteredIds[0];
  renderCard();
}

function renderCard() {
  const deck = DECKS[currentLang];
  const [front, back, tag] = deck[currentIndex];
  document.getElementById("wordFront").textContent = front;
  document.getElementById("wordBack").textContent = back;
  document.getElementById("stampFront").textContent = tag;
  document.getElementById("stampBack").textContent = tag;
  refreshSpeakAvailability();
}

function setButtonsEnabled(enabled) {
  document.querySelectorAll(".rate").forEach(b => b.disabled = !enabled);
}

function flip() {
  if (currentIndex === -1) return;
  showingBack = !showingBack;
  document.getElementById("cardInner").classList.toggle("flipped", showingBack);
}

document.getElementById("faceFront").addEventListener("click", (e) => {
  if (e.target.closest(".speak-btn")) return;
  flip();
});
document.getElementById("faceBack").addEventListener("click", (e) => {
  if (e.target.closest(".speak-btn")) return;
  flip();
});

document.querySelectorAll(".rate").forEach(btn => {
  btn.addEventListener("click", () => {
    if (currentIndex === -1) return;
    rate(currentIndex, parseInt(btn.dataset.q, 10));
    filteredIds.shift();
    document.getElementById("dueCount").textContent = filteredIds.length + " pendientes";
    showNext();
  });
});

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});
document.getElementById("tagFilter").addEventListener("change", () => { buildQueue(); showNext(); });

function rate(i, q) {
  const c = getCard(i);
  const now = Date.now();
  const DAY = 24 * 60 * 60 * 1000;
  if (q === 0) {
    c.reps = 0; c.interval = 0; c.due = now + 5 * 60 * 1000; c.ef = Math.max(1.3, c.ef - 0.2);
  } else {
    c.reps += 1;
    if (q === 1) c.ef = Math.max(1.3, c.ef - 0.15);
    if (q === 3) c.ef = c.ef + 0.15;
    if (c.reps === 1) c.interval = q === 1 ? 1 : (q === 3 ? 3 : 1);
    else if (c.reps === 2) c.interval = q === 1 ? 2 : (q === 3 ? 8 : 4);
    else c.interval = Math.round(c.interval * c.ef);
    c.due = now + c.interval * DAY;
  }
  progress[String(i)] = c;
  saveProgress();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("¿Reiniciar el progreso de " + LANG_META[currentLang].name + " en este dispositivo?")) {
    progress = {}; saveProgress(); buildQueue(); showNext();
  }
});

function loadVoices() {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) { resolve([]); return; }
    let voices = window.speechSynthesis.getVoices();
    if (voices.length) { resolve(voices); return; }
    window.speechSynthesis.onvoiceschanged = () => resolve(window.speechSynthesis.getVoices());
    setTimeout(() => resolve(window.speechSynthesis.getVoices()), 1000);
  });
}
function pickVoice(voices, langTag) {
  const base = langTag.split("-")[0].toLowerCase();
  return voices.find(v => v.lang.toLowerCase() === langTag.toLowerCase())
      || voices.find(v => v.lang.toLowerCase().startsWith(base)) || null;
}
function cleanForSpeech(text) { return text.replace(/\([^)]*\)/g, "").trim(); }

async function refreshSpeakAvailability() {
  const btns = [document.getElementById("speakBtnFront"), document.getElementById("speakBtnBack")];
  if (!("speechSynthesis" in window)) { btns.forEach(b => b.disabled = true); return; }
  voicesCache = voicesCache || await loadVoices();
  const voice = pickVoice(voicesCache, SPEECH_LANG[currentLang]);
  btns.forEach(b => {
    b.textContent = voice ? "🔊" : "🔇";
    b.title = voice ? "Escuchar pronunciación" : "Falta instalar la voz de este idioma (Ajustes > Accesibilidad > Contenido hablado > Voces)";
  });
}

async function speakCurrentFront() {
  const deck = DECKS[currentLang];
  if (currentIndex === -1 || !deck[currentIndex]) return;
  if (!("speechSynthesis" in window)) return;
  try {
    voicesCache = voicesCache || await loadVoices();
    const voice = pickVoice(voicesCache, SPEECH_LANG[currentLang]);
    if (!voice) {
      alert("Tu dispositivo no tiene instalada la voz de " + LANG_META[currentLang].name + ". Ve a Ajustes > Accesibilidad > Contenido hablado > Voces y descárgala.");
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(cleanForSpeech(deck[currentIndex][0]));
    utter.voice = voice; utter.lang = voice.lang; utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}
document.getElementById("speakBtnFront").addEventListener("click", (e) => { e.stopPropagation(); speakCurrentFront(); });
document.getElementById("speakBtnBack").addEventListener("click", (e) => { e.stopPropagation(); speakCurrentFront(); });

setLang(currentLang);
</script>
</body>
